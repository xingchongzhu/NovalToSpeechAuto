# Fish Speech 测试环境 Docker Compose
# 使用方式: docker compose up -d

services:
  fish-speech:
    # Fish Speech 1.5 官方镜像
    image: fishaudio/fish-speech:latest
    container_name: fish-speech-test
    restart: unless-stopped
    
    ports:
      - "7860:7860"   # Gradio WebUI
      - "8080:8080"    # REST API
    
    volumes:
      # 挂载模型权重目录
      - ./checkpoints:/app/checkpoints
      # 挂载参考音频目录（使用主项目的 clone-audio）
      - ../clone-audio:/app/references
    
    environment:
      - COMPILE=1
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
      - API_SERVER_NAME=0.0.0.0
      - API_SERVER_PORT=8080
    
    # 如果使用 AMD/ROCm GPU，改用 compose.rocm.yml
    # 如果是 CPU 模式，设置 environment 中 BACKEND=cpu
    
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
