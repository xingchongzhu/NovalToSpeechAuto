# Fish Speech 测试环境 — CPU 模式 (macOS Apple Silicon 可用)
# 使用方式: docker compose -f compose.cpu.yml up -d

services:
  fish-speech:
    image: fishaudio/fish-speech:latest
    container_name: fish-speech-test-cpu
    restart: unless-stopped
    
    ports:
      - "7860:7860"
      - "8080:8080"
    
    volumes:
      - ./checkpoints:/app/checkpoints
      - ../clone-audio:/app/references
    
    environment:
      - BACKEND=cpu
      - COMPILE=0
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
      - API_SERVER_NAME=0.0.0.0
      - API_SERVER_PORT=8080
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
